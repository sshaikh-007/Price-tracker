# Runs tracker.py every 30 minutes on GitHub's free runners.
# Put this folder's files at the ROOT of a new GitHub repo, then add repo
# secrets TELEGRAM_BOT_TOKEN and TELEGRAM_CHAT_ID (and/or NTFY_TOPIC).
# Free minutes: unlimited on a PUBLIC repo (secrets stay hidden; leave the
# token fields in tracker.py empty). A PRIVATE repo gets 2,000 min/month and
# each run bills ~2 min, so change the cron to "0 * * * *" (hourly) there.
name: FlexiSpot price tracker

on:
  schedule:
    # Backup only. GitHub's scheduler is best-effort and drops many runs on new or
    # quiet repos, especially at :00/:30 when everyone's jobs fire. The reliable
    # 30-minute trigger is cron-job.org calling workflow_dispatch (see README).
    - cron: "7,37 * * * *"
  workflow_dispatch:          # "Run workflow" button, and the cron-job.org trigger
    inputs:
      test_alert:
        description: "Only send a test Telegram/ntfy message (no price check)"
        type: boolean
        default: false

permissions:
  contents: write             # needed to commit price_history.csv

concurrency:
  group: price-tracker
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04     # ubuntu-latest is 26.04, which Playwright 1.57 can't install Chromium on
    timeout-minutes: 10
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Send test alert
        if: ${{ inputs.test_alert }}
        run: python tracker.py --test-alert

      - name: Install dependencies
        if: ${{ !inputs.test_alert }}
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Check price
        if: ${{ !inputs.test_alert }}
        run: python tracker.py --target 380

      - name: Save price history
        if: ${{ !inputs.test_alert }}
        run: |
          git config user.name "price-tracker-bot"
          git config user.email "price-tracker-bot@users.noreply.github.com"
          git add price_history.csv
          git diff --cached --quiet || git commit -m "price check $(date -u +%FT%TZ)"
          git push
